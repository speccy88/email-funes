name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional RTF decoder
        run: 'python -m pip install --only-binary=:all: -r requirements/rtf.txt'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Place a synthetic file in a stale build directory
        run: >
          python -c "from pathlib import Path;
          p=Path('build/lib/synthetic.jsonl'); p.parent.mkdir(parents=True, exist_ok=True);
          p.write_text('synthetic wheel exclusion test', encoding='utf-8')"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test the installed wheel outside the checkout
        run: python tests/smoke_wheel.py dist
      - name: Create synthetic SQLite archive
        run: python examples/create_demo_db.py --db data/demo.sqlite
      - name: Export synthetic Funes records
        run: python scripts/sqlite_to_funes.py --db data/demo.sqlite --include-all --out data/demo-funes
      - name: Create synthetic enriched archive
        run: python examples/create_demo_db.py --db data/demo-enriched.sqlite --enriched
      - name: Preview enriched email selection
        run: python scripts/sqlite_to_funes.py --db data/demo-enriched.sqlite --dry-run
      - name: Export enriched email records
        run: python scripts/sqlite_to_funes.py --db data/demo-enriched.sqlite --out data/demo-enriched-funes
