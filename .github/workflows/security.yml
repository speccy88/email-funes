name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history and checkout with Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --max-time 90 --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .
          "$RUNNER_TEMP/gitleaks" dir --redact .
  dependencies:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install advisory scanner
        run: python -m pip install pip-audit==2.10.1
      - name: Read build and runtime dependencies from the package
        run: >
          python -c "import os, pathlib, tomllib;
          spec=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'));
          groups=spec['project']['optional-dependencies'].values();
          pins=spec['build-system']['requires'] + spec['project']['dependencies'] + [pin for group in groups for pin in group];
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'email-funes-audit.txt').write_text('\n'.join(pins), encoding='utf-8')"
      - name: Audit resolved dependencies for this platform
        shell: bash
        run: python -m pip_audit --strict -r "$RUNNER_TEMP/email-funes-audit.txt"
